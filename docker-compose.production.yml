services:
  portal:
    container_name: mattr-portal
    image: ${PORTAL_IMAGE:?PORTAL_IMAGE is required}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ${PORTAL_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${PORTAL_HTTP_PORT:-3000}:3000"
