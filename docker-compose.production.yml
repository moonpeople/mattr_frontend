services:
  portal:
    container_name: mattr-portal
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${PORTAL_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${PORTAL_HTTP_PORT:-3000}:3000"
